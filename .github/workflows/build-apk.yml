name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform (once)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Force landscape orientation
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'screenOrientation' "$MANIFEST"; then
            sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pixel-rpg.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pixel-rpg.apk
          generate_release_notes: true
