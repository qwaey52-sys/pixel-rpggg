name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Force landscape orientation
        run: |
          F=android/app/src/main/AndroidManifest.xml
          grep -q screenOrientation "$F" || perl -0pi -e 's/<activity(\s)/<activity android:screenOrientation="sensorLandscape"$1/' "$F"
          grep screenOrientation "$F"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pixel-rpg.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: pixel-rpg.apk
          generate_release_notes: true
